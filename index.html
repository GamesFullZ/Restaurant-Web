<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161412" />
    <meta name="description" content="Mesa — cocina mexicana contemporánea en el Barrio Antiguo de Monterrey. Reserva tu mesa exacta en el plano. Proyecto de portafolio · restaurante ficticio." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Mesa · Cocina mexicana contemporánea</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
      }
      #splash .sp-layer {
        position: absolute;
        inset: 0;
        transition: transform 0.9s cubic-bezier(0.76, 0, 0.18, 1);
      }
      #splash .sp-chile {
        background: #c4432a;
        transition-delay: 0.1s;
      }
      #splash .sp-ink {
        background: #161412;
        color: #f4efe6;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
      }
      #splash .sp-mark {
        width: 92px;
        height: 92px;
        overflow: visible;
      }
      #splash .sp-mark rect {
        stroke-dasharray: 90;
        stroke-dashoffset: 90;
        animation: sp-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
      }
      #splash .sp-mark circle {
        transform-origin: 19.5px 16px;
        transform: translateX(-3.5px) scale(0);
        animation: sp-dot 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s forwards;
      }
      #splash .sp-cap {
        margin: 0;
        font: 500 11px/1 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        opacity: 0;
        animation: sp-fade 0.6s ease 0.7s forwards;
      }
      #splash .sp-bar {
        width: 120px;
        height: 2px;
        background: rgba(244, 239, 230, 0.16);
        overflow: hidden;
      }
      #splash .sp-bar i {
        display: block;
        height: 100%;
        background: #dda43a;
        transform-origin: left;
        animation: sp-load 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #splash.is-out .sp-layer {
        transform: translateY(-101%);
      }
      #splash.is-out .sp-ink > * {
        opacity: 0 !important;
        transition: opacity 0.25s ease;
      }
      @keyframes sp-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes sp-dot {
        to {
          transform: translateX(0) scale(1);
        }
      }
      @keyframes sp-fade {
        to {
          opacity: 0.7;
        }
      }
      @keyframes sp-load {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(0.92);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation-duration: 1ms !important;
          animation-delay: 0s !important;
          transition: opacity 0.3s ease !important;
        }
        #splash.is-out {
          opacity: 0;
          transition: opacity 0.3s ease;
        }
        #splash.is-out .sp-layer {
          transform: none;
        }
      }
    </style>
    <script>
      // El render del taco solo se precarga en la portada.
      (function () {
        var base = '%BASE_URL%';
        var p = location.pathname;
        var home = location.hash ? /^#\/?$/.test(location.hash) : base.charAt(0) === '.' || p === base || p + '/' === base || p === '/' || /\/index\.html$/.test(p);
        if (!home) return;
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = base + 'images/taco-hero.webp';
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <noscript>Esta demo necesita JavaScript para funcionar.</noscript>
    <div id="splash" aria-hidden="true">
      <div class="sp-layer sp-chile"></div>
      <div class="sp-layer sp-ink">
        <svg class="sp-mark" viewBox="0 0 32 32">
          <rect x="3.5" y="7.5" width="25" height="17" rx="1.5" fill="none" stroke="#F4EFE6" stroke-width="1.6" />
          <circle cx="19.5" cy="16" r="5" fill="#C4432A" />
        </svg>
        <p class="sp-cap">Mesa · Monterrey</p>
        <span class="sp-bar"><i></i></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
